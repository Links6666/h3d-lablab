[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# 排除依赖源码目录（py4dgeo-1.2.0 自带测试，避免误收集）
norecursedirs = ["py4dgeo-1.2.0", "output", "docs", "examples", "notebooks", "*.egg-info", ".*"]

[project]
name = "h3d"
version = "1.1.10"
description = "中小型文物三维建模自动化系统(路线E)"
requires-python = ">=3.10"
dependencies = [
  "open3d>=0.18",
  "numpy>=1.24",
  "py4dgeo>=0.8",
  "pyyaml>=6.0",
  "colour-science>=0.4",
  "matplotlib>=3.7",
  "trimesh>=4.0",
  "tqdm>=4.66",
  "opencv-python-headless>=4.9",
  "cupy-cuda12x>=13.0",
  "PySide6>=6.11",
  "jinja2>=3.1",
  "xatlas>=0.0.11",
  "psutil>=5.9"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "mypy>=1.8"]

[project.scripts]
h3d = "h3d.cli:main"

[tool.setuptools.packages.find]
where = ["src"]