# 交付链路核验用配置（真机 relic_001）
# 用途：只验证「跑批 → 报表 → 交付」这条机制，不改任何产品默认值。
# 质量门在本文件里放宽，原因是这件数据本来达不到 5mm/80%——M5 一 fail，
# M6 与报表就不会执行，交付目录永远是空的，机制验不到。
project:
  name: relic_delivery
  raw_dir: D:/h3d_relic_test/00_raw
  formats: [ply, obj, glb]

sfm_solve:
  enabled: false          # 用既有 capture_meta，不重跑 COLMAP

texture:
  paint_mode: photo
  export_formats: [ply, obj, glb]

photo_texture:
  texture_size: 2048

quality:
  enabled: true
  coverage_threshold: 0.30
  rmse_threshold_mm: 500.0

report:
  enabled: true

runner:
  workers: 1
  # 必须是**阶段账本**，不能是 90_meta/delivery_manifest.json（那是 M6 的交付
  # 摘要，schema 不同）。指错了 M6 会把账本覆盖成 0 条阶段记录。
  # 这个项目的阶段账本历史地落在 90_meta/delivery_manifest.json（有 stages、
  # 11 条记录、产物 0 缺失）。改名属数据整理，暂不动；M6 现在会**拒绝**
  # 覆盖它并留 WARNING，所以账本不会再被弄没。
  manifest: D:/h3d_relic_test/阶段成果/90_meta/delivery_manifest.json
